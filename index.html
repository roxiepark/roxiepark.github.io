<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hyeyoung Park</title>
    <meta
      name="description"
      content="HYEYOUNG PARK short-form reels and photo portfolio."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://roxiepark.github.io">
    <meta property="og:title" content="Hyeyoung Park">
    <meta
      property="og:description"
      content="HYEYOUNG PARK short-form reels and photo portfolio."
    >
    <meta property="og:image" content="https://roxiepark.github.io/assets/share-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="styles.css">
    <link rel="preload" as="image" href="assets/icons/back.png">
    <link rel="preload" as="image" href="assets/icons/heart.png">
    <link rel="preload" as="image" href="assets/icons/heart-filled.png">
    <link rel="preload" as="image" href="assets/icons/comment.png">
    <link rel="preload" as="image" href="assets/icons/share.png">
    <link rel="preload" as="image" href="assets/icons/mute.png">
    <link rel="preload" as="image" href="assets/icons/unmute.png">
  </head>
  <body>
    <main class="portfolio-page" aria-label="Hyeyoung Park">
      <header class="site-header" aria-label="Portfolio contact">
        <button type="button" class="pane-back" aria-label="Back to menu">
          <img src="assets/icons/back.png" alt="" aria-hidden="true">
        </button>
        <p>SM ENTERTAINMENT</p>
        <p class="contact-line">
          <span>HYEYOUNG PARK 1999.09.08</span>
          <a href="mailto:roxie2339@gmail.com">ROXIE2339@GMAIL.COM</a>
        </p>
        <p><a href="tel:+821039941384">+82 010-3994-1384</a></p>
      </header>

      <section class="content-grid" aria-label="Reels and photos">
        <div class="pane-menu" aria-label="Choose reels or photos">
          <button type="button" class="pane-menu-option" data-pane="reels">
            <span class="pane-menu-option-title">REELS</span>
            <span class="pane-menu-option-label">Loading</span>
          </button>
          <button type="button" class="pane-menu-option" data-pane="photos">
            <span class="pane-menu-option-title">PHOTOS</span>
            <span class="pane-menu-option-label">Loading</span>
          </button>
        </div>

        <section class="media-pane reels-pane is-loading" aria-label="Reels">
          <div class="pane-loading" aria-hidden="true">
            <span class="pane-loading-title">REELS</span>
            <span class="pane-loading-label">Loading</span>
          </div>
          <div class="pane-scroll" data-scroll-pane="reels">
            <div id="reelsList" class="reels-list"></div>
          </div>
          <div class="custom-scrollbar" aria-hidden="true">
            <span class="custom-scrollbar-thumb"></span>
          </div>
        </section>

        <section class="media-pane photos-pane is-loading" aria-label="Photos">
          <div class="pane-loading" aria-hidden="true">
            <span class="pane-loading-title">PHOTOS</span>
            <span class="pane-loading-label">Loading</span>
          </div>
          <div class="photos-surface">
            <div class="pane-scroll" data-scroll-pane="photos">
              <div id="photosGrid" class="photos-grid"></div>
            </div>
          </div>
          <div class="custom-scrollbar" aria-hidden="true">
            <span class="custom-scrollbar-thumb"></span>
          </div>
        </section>
      </section>

      <footer class="site-footer" aria-label="Site footer">
        <img src="assets/logo.png" alt="SM Entertainment" class="site-footer-logo">
        <div class="thumbnail-rail" data-rail="reels" aria-label="Reels thumbnails"></div>
        <div class="thumbnail-rail" data-rail="photos" aria-label="Photos thumbnails"></div>
      </footer>
    </main>

    <script src="media.js"></script>
    <script src="script.js"></script>
  </body>
</html>
